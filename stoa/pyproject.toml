[project]
name = "bp"
version = "0.1.0"
description = "Make Blueprints Talk: evaluation harness, trusted tools and solvers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.9",
  "numpy>=2.0",
  "shapely>=2.0",
  "pymupdf>=1.24",
  "ezdxf>=1.3",
  "ifcopenshell==0.9.0.post1",
  "pillow>=11",
  "httpx>=0.27",
  "typer>=0.15",
  "rapidocr>=3",
  "onnxruntime>=1.32.0",
  "segmentation-models-pytorch>=0.6.0",
]

[dependency-groups]
dev = ["ruff>=0.8", "ty>=0.0.100", "pytest>=8", "hypothesis>=6.100"]
ml = ["torch>=2.6", "torchvision>=0.21", "timm>=1.0", "opencv-python-headless>=4.10"]

[tool.uv]
default-groups = ["dev", "ml"]

[project.scripts]
bp = "bp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bp"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["analysis", "video", "data", "docs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D1", "D203", "D213", "D401", "CPY", "TC001", "PLR0917", "FBT003", "SIM105", "PTH208", "ISC004", "E501", "FBT001", "FBT002", "PLR0913", "BLE001", "TRY003", "EM101", "EM102", "PLW0108",      # docstrings: module text explains, not each symbol
  "COM812", "ISC001",        # formatter conflicts
  "S101",                    # assert is the test tool
  "PLR2004",                 # constants in tests and scoring tables
  "TD", "FIX",
  "T201",                    # the CLI prints
  "S603", "S607",            # subprocess with fixed arguments
]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.pylint]
max-positional-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG002", "ANN", "INP001", "SLF001"]
"jobs/*" = ["INP001"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
